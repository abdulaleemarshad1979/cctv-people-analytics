services:
  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "${MEDIAMTX_BIND:-127.0.0.1}:8554:8554"   # RTSP; keep on localhost unless something outside must publish
      - "${WEBRTC_BIND:-0.0.0.0}:8189:8189/udp"   # live video to the browsers (WebRTC); must be reachable from them
      - "${WEBRTC_BIND:-0.0.0.0}:8189:8189/tcp"   # same, when UDP is blocked
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${WEBRTC_HOSTS:-127.0.0.1}   # the server's LAN / VPN address(es), comma separated
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro

  analytics:
    build: .
    image: cctv-people-analytics
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - mediamtx
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-5000}:5000"
    volumes:
      - ./config:/config
      - ./weights:/weights:ro
    environment:
      MEDIAMTX_API: http://mediamtx:9997          # the app registers cameras here and reads them from MediaMTX (one NVR session each)
      MEDIAMTX_WEBRTC_URL: http://mediamtx:8889   # browsers get live video over WebRTC, MJPEG when that cannot start
      MEDIAMTX_HLS_URL: http://mediamtx:8888      # smooth live video (LL-HLS) through the web port, tried first
      DM_COUNT_WEIGHTS: /weights/model_nwpu.pth
      CSRNET_WEIGHTS: /weights/csrnet_shtechA.pth
      LOGIN_USER: ${LOGIN_USER:-admin}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-admin123}
      INOUT_FPS: ${INOUT_FPS:-10}
      INOUT_IMGSZ: ${INOUT_IMGSZ:-640}
      INOUT_CONFIDENCE: ${INOUT_CONFIDENCE:-0.35}   # lower (e.g. 0.25) if walkers at the line are missed at night
      CROWD_INTERVAL_S: ${CROWD_INTERVAL_S:-30}
      DETECT_INTERVAL_S: ${DETECT_INTERVAL_S:-30}
      INOUT_WORKERS: ${INOUT_WORKERS:-}     # blank = by core count
      CROWD_WORKERS: ${CROWD_WORKERS:-}
      ACTIVE_CAMERA_COUNT: ${ACTIVE_CAMERA_COUNT:-7}   # only open the first seven; preserve all saved camera settings
      WEB_THREADS: ${WEB_THREADS:-64}      # blocking HLS playlists share these with API and health requests
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/healthz', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s
