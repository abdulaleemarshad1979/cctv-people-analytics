server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Camera video goes directly from MediaMTX through Nginx. The application
    # checks the existing login cookie for each playlist and segment request.
    location = /_hls_auth {
        internal;
        set $auth_upstream http://analytics:5000;
        proxy_pass $auth_upstream/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # H.265 cameras may need the app's shared H.264 copy. Its playlist polls keep
    # that encoder alive and wait for it to start; its segments go straight to
    # MediaMTX below (through Python they took ~1 s each and stuttered).
    location ~ ^/hls/[A-Za-z0-9_-]+_view/[A-Za-z0-9_.-]+\.m3u8$ {
        auth_request /_hls_auth;
        set $analytics_upstream http://analytics:5000;
        proxy_pass $analytics_upstream$request_uri;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    location ~ ^/hls/(?<hls_path>[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+\.(?:m3u8|mp4))$ {
        auth_request /_hls_auth;
        set $hls_upstream http://mediamtx:8888;
        proxy_pass $hls_upstream/$hls_path$is_args$args;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        set $analytics_upstream http://analytics:5000;
        proxy_pass $analytics_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
